server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: agenda-facil-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/agenda_facil?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: America/Sao_Paulo
  jackson:
    time-zone: America/Sao_Paulo

agenda:
  # Troque em produção (mínimo 32 caracteres) via variável de ambiente JWT_SECRET
  jwt-secret: ${JWT_SECRET:agenda-facil-chave-secreta-de-desenvolvimento-trocar-em-producao}
  jwt-horas: 24
  # true: agendamento já nasce CONFIRMADO (como na tela do Figma). false: nasce PENDENTE e o profissional confirma (RF007)
  auto-confirmar: ${AGENDA_AUTO_CONFIRMAR:true}
  # Em produção, depois do primeiro uso, pode desligar com AGENDA_SEED=false
  seed: ${AGENDA_SEED:true}
