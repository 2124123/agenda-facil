services:
  mysql:
    image: mysql:8.4
    container_name: agenda-facil-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agenda_facil
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - agenda_facil_data:/var/lib/mysql
volumes:
  agenda_facil_data:
